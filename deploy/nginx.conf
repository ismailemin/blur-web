# Blur Web — nginx reverse proxy for the public host
#
#   https://play.example.com/      -> 127.0.0.1:8801  (the page server)
#   wss://play.example.com/ws      -> 127.0.0.1:8811  (the room service)
#
# Certificate: use certbot (`certbot --nginx -d play.example.com`) or point the
# two ssl_* lines at the certificate you already have. Replace `play.example.com`
# with the real hostname.
#
# The game process is started by `tools/deploy_local.ps1 -Bind 127.0.0.1` (or the
# equivalent `node probes/e1-drive/tools/serve.mjs --host 127.0.0.1 --with-room`).

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	server_name play.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name play.example.com;

	ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;

	# The room service is a raw RFC 6455 WebSocket server on /ws.
	location /ws {
		proxy_pass http://127.0.0.1:8811;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	# The page server (HTML, JS modules, _work assets).
	location / {
		proxy_pass http://127.0.0.1:8801;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}
}
